<style>
/* VOICE: painel de farm de um jogador experiente: direto, denso, sem enfeite
   IDEA: a planilha "Resumo por Item" do Otavio virou um app de bolso com tela cheia no desktop
   PICTURE: cartão FOCO AGORA em âmbar + banco de itens com barras de etapa nas cores dos tiers
   COLOUR and TYPE: navy 1F3A5F, âmbar, verde; tiers T1 ciano, T2 azul, T3 roxo, T4 magenta; Rubik; tema claro e escuro
   LAYOUT: celular = abas embaixo (Resumo, Itens, Talentos, Bônus); desktop = resumo no topo, itens + bônus, talentos em grade */
:root{color-scheme:light dark;--bg:#F4F6FA;--card:#fff;--line:#E3E8EF;--line2:#D3DAE5;--line3:#9FB0C8;--ink:#1F2937;--ink2:#4B5563;--mut:#566070;--top:#1F3A5F;--accent:#1F3A5F;--accentBg:#1F3A5F;--accentBg2:#2B4C78;--hover:#F2F6FB;--head:#F8FAFC;--seg:#E9EDF3;--amb:#FFE9A8;--amb2:#FFF6D6;--ambInk:#4A3000;--brown:#8A5A00;--ambLine:#EFD48A;--ambHover:#FFF1C4;--inLine:#E8D59A;--nextBg:#FFFAF4;--orange:#C2410C;--ok:#1E7B4B;--okFill:#1E7B4B;--okBg:#CDEFDB;--okSoft:#E6F6EC;--okLine:#A7D8B8;--bad:#B42318;--badBg:#FAD4D0;--badSoft:#FDECEA;--badLine:#F2B8B1;--mid:#FFF3CC;--par:#E7F0FB;--parInk:#2F6DB5;--info:#E7F0FB;--infoLine:#BCD3F0;--doneBg:#F7FBF8;--doneLine:#CFE8D8;--track:#E6EAF0;--trackSoft:rgba(255,255,255,.85);--pendFill:#F2C14E;--tabbar:rgba(255,255,255,.97);--toast:#16263D;--scrim:rgba(15,23,42,.48);--shadow:rgba(15,23,42,.18);--t1c:#0E7490;--t1s:#E0F2F7;--t1t:#0E7490;--t2c:#2F6DB5;--t2s:#E7F0FB;--t2t:#2F6DB5;--t3c:#6B4FB0;--t3s:#F0EBFA;--t3t:#6B4FB0;--t4c:#A21CAF;--t4s:#F8E8FA;--t4t:#A21CAF;--r:14px}
@supports (color:light-dark(#000,#fff)){:root{--bg:light-dark(#F4F6FA,#0D1520);--card:light-dark(#fff,#151F2E);--line:light-dark(#E3E8EF,#233145);--line2:light-dark(#D3DAE5,#2E3E55);--line3:light-dark(#9FB0C8,#4D6282);--ink:light-dark(#1F2937,#E5ECF6);--ink2:light-dark(#4B5563,#B6C2D3);--mut:light-dark(#566070,#8D9BB0);--top:light-dark(#1F3A5F,#0A111C);--accent:light-dark(#1F3A5F,#A9C8F7);--accentBg:light-dark(#1F3A5F,#335E9C);--accentBg2:light-dark(#2B4C78,#3D6DB2);--hover:light-dark(#F2F6FB,#1B283B);--head:light-dark(#F8FAFC,#121B28);--seg:light-dark(#E9EDF3,#0F1824);--amb:light-dark(#FFE9A8,#4A3A12);--amb2:light-dark(#FFF6D6,#262012);--ambInk:light-dark(#4A3000,#FFE6A6);--brown:light-dark(#8A5A00,#E5C06B);--ambLine:light-dark(#EFD48A,#5B4919);--ambHover:light-dark(#FFF1C4,#30281A);--inLine:light-dark(#E8D59A,#6B5826);--nextBg:light-dark(#FFFAF4,#1A2130);--orange:light-dark(#C2410C,#F2884B);--ok:light-dark(#1E7B4B,#7DD8A3);--okFill:light-dark(#1E7B4B,#237A4B);--okBg:light-dark(#CDEFDB,#173B29);--okSoft:light-dark(#E6F6EC,#12291C);--okLine:light-dark(#A7D8B8,#2C6444);--bad:light-dark(#B42318,#FF9C91);--badBg:light-dark(#FAD4D0,#4A1E1E);--badSoft:light-dark(#FDECEA,#2E1517);--badLine:light-dark(#F2B8B1,#6A2B2B);--mid:light-dark(#FFF3CC,#3B3016);--par:light-dark(#E7F0FB,#172A45);--parInk:light-dark(#2F6DB5,#98BFF4);--info:light-dark(#E7F0FB,#152740);--infoLine:light-dark(#BCD3F0,#2B4A74);--doneBg:light-dark(#F7FBF8,#122218);--doneLine:light-dark(#CFE8D8,#234A34);--track:light-dark(#E6EAF0,#25334A);--trackSoft:light-dark(rgba(255,255,255,.85),rgba(255,255,255,.1));--pendFill:light-dark(#F2C14E,#D7A73C);--tabbar:light-dark(rgba(255,255,255,.97),rgba(16,25,38,.97));--toast:light-dark(#16263D,#2A3C57);--scrim:light-dark(rgba(15,23,42,.48),rgba(0,0,0,.62));--shadow:light-dark(rgba(15,23,42,.18),rgba(0,0,0,.5));--t1c:light-dark(#0E7490,#1593AE);--t1s:light-dark(#E0F2F7,#0D2930);--t1t:light-dark(#0E7490,#6DCFE3);--t2c:light-dark(#2F6DB5,#3B7CD6);--t2s:light-dark(#E7F0FB,#13233A);--t2t:light-dark(#2F6DB5,#8EB9F3);--t3c:light-dark(#6B4FB0,#7F64D4);--t3s:light-dark(#F0EBFA,#211B37);--t3t:light-dark(#6B4FB0,#BCA7F5);--t4c:light-dark(#A21CAF,#BB3BC9);--t4s:light-dark(#F8E8FA,#2B1530);--t4t:light-dark(#A21CAF,#EB99F4)}}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
:root[data-tema=claro]{color-scheme:light}:root[data-tema=escuro]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Rubik,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums;overflow-x:clip;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.55}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;background:var(--top);color:#fff;padding:calc(8px + env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left))}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{width:34px;height:34px;flex:none}
.brand b{display:block;font-size:17px;font-weight:600;line-height:1.15}
.brand small{display:block;font-size:12px;opacity:.78}
.tsel{display:flex;align-items:center;gap:6px;font-size:13px}
.chipT{border:1.5px solid rgba(255,255,255,.45);background:transparent;color:#fff;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:600;min-height:32px}
.chipT[aria-pressed=true]{background:#fff;color:#1F3A5F;border-color:#fff}
.tsel.light{margin:0 0 12px;color:var(--mut);flex-wrap:wrap}
.tsel.light .chipT{border-color:var(--line2);color:var(--accent);background:var(--card);min-height:36px;padding:4px 14px}
.tsel.light .chipT[aria-pressed=true]{background:var(--accentBg);color:#fff;border-color:var(--accentBg)}
.sync{font-size:12px;white-space:nowrap;opacity:.92}
.sync::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#9CA3AF;margin-right:6px;vertical-align:1px}
.sync.ok::before{background:#7BC796}.sync.w::before{background:#F5C451}.sync.bad::before{background:#F28B82}
.icb{width:40px;height:40px;border-radius:10px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:22px;line-height:1;flex:none;display:inline-flex;align-items:center;justify-content:center}
.icb svg{width:20px;height:20px}
.menu{position:fixed;z-index:35;top:calc(60px + env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px var(--shadow);padding:6px;display:grid;min-width:260px}
.menu>button{border:0;background:none;text-align:left;padding:11px 12px;border-radius:8px;font-size:15px}
.menu>button:hover{background:var(--hover)}
.mtema{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 6px 6px 12px;margin-top:4px;border-top:1px solid var(--line);font-size:15px}
.main{max-width:1680px;margin:0 auto;padding:14px max(14px,env(safe-area-inset-right)) 28px max(14px,env(safe-area-inset-left));display:grid;gap:16px;align-items:start}
.panel{display:none}
.panel.on{display:block}
.ph{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin:2px 0 10px}
.ph h2{margin:0;font-size:19px;font-weight:600;color:var(--accent)}
.cnt{font-size:13px;color:var(--mut)}
.sp{margin-left:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.lbl{font-size:12px;font-weight:600;color:var(--mut);letter-spacing:.02em;margin-bottom:6px}
.pk{font-size:13px;color:var(--mut)}
.seg{display:inline-flex;background:var(--seg);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--ink2);min-height:32px}
.seg button[aria-pressed=true]{background:var(--card);color:var(--accent);box-shadow:0 1px 2px var(--shadow)}
.btn{border:1.5px solid var(--accent);background:var(--card);color:var(--accent);border-radius:10px;padding:7px 14px;font-weight:600;font-size:14px;min-height:40px}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accentBg);border-color:var(--accentBg);color:#fff}
.btn.pri:hover{background:var(--accentBg2)}
.btn.on{background:var(--okFill);border-color:var(--okFill);color:#fff}
.btn.ghost{border-color:var(--line2);color:var(--ink2)}
.btn.sm{min-height:34px;padding:4px 12px;font-size:13px}
.lnk{border:0;background:none;color:var(--mut);text-decoration:underline;font-size:13px;padding:6px 4px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--okBg);color:var(--ok)}.p-mid{background:var(--mid);color:var(--brown)}.p-bad{background:var(--badBg);color:var(--bad)}.p-par{background:var(--par);color:var(--parInk)}
.mk{font-weight:700;font-style:normal}.mk.f{color:var(--orange)}.mk.n{color:#93A1C3}
.rgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr))}
.focus{background:var(--amb2);border:1px solid var(--ambLine);border-radius:var(--r);overflow:hidden}
.focus .hd{background:var(--amb);color:var(--ambInk);font-size:12px;font-weight:700;letter-spacing:.06em;padding:7px 14px}
.focus .bd{padding:12px 14px 14px}
.fname{font-size:20px;font-weight:600;color:var(--ambInk);line-height:1.2}
.fpoke{font-size:13px;color:var(--brown)}
.fbig{font-size:clamp(34px,5vw,46px);font-weight:700;color:var(--ambInk);line-height:1;margin:8px 0 10px}
.fbig small,.nbig small{font-size:14px;font-weight:500;color:var(--brown)}
.fhint{font-size:13px;color:var(--brown);margin-top:8px}
.fact{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.nname{font-size:17px;font-weight:600;color:var(--accent);line-height:1.25}
.nbig{font-size:28px;font-weight:700;line-height:1.1;margin:6px 0 8px}
.nbig small{color:var(--mut)}
.pgrid{display:flex;gap:14px;align-items:center}
.ring{flex:none}
.pline{font-size:14px;color:var(--ink2);line-height:1.6}.pline b{font-size:18px;color:var(--ink)}
.tbars{display:grid;gap:6px;margin-top:12px}
.tb{display:grid;grid-template-columns:26px minmax(0,1fr) 46px;gap:8px;align-items:center;font-size:12px;font-weight:600}
.tbb{height:8px;background:var(--track);border-radius:4px;overflow:hidden;display:flex}
.tbb i.pp{opacity:.42}
.tb{grid-template-columns:26px minmax(0,1fr) 74px}
.tb small{display:block;font-size:12px;font-weight:500;color:var(--mut)}
.tleg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mut);margin-top:8px}.tleg i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle;background:var(--accent)}.tleg i.pp{background-color:var(--accent);opacity:.42}
.pnote{font-size:12px;color:var(--ink2);margin-top:6px}
.tbb i{display:block;height:100%}
.tb span:last-child{text-align:right;color:var(--mut)}
.rl{display:flex;align-items:center;gap:8px;padding:7px 0;border:0;border-top:1px solid var(--line);font-size:13px;background:none;width:100%;text-align:left;color:var(--ink)}
.rl:first-child{border-top:0}
.rl .rtx{flex:1;color:var(--ink2)}
.rl .rnm{font-weight:600;color:var(--ink)}
.tid{display:inline-block;font-size:12px;font-weight:700;color:#fff;border-radius:6px;padding:2px 7px;white-space:nowrap;background:var(--tc,#1F3A5F)}
.imp{background:var(--info);border:1px solid var(--infoLine);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.imp p{margin:0;flex:1 1 260px}
.stg{display:flex;gap:3px;height:10px;width:100%}
.stg .s{position:relative;flex:1 1 0;background:var(--track);border-radius:3px;overflow:hidden}
.stg .s i{position:absolute;top:0;bottom:0;left:0}
.cap{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mut);margin-top:4px}
.cap b{color:var(--ink)}
.ilist{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.irow{display:grid;grid-template-columns:16px minmax(0,1.35fr) 140px 96px minmax(0,1.5fr) 118px;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);cursor:pointer}
.irow:hover{background:var(--hover)}
.ilist>.irow:first-child{border-top:0}
.ihead{cursor:default;background:var(--head);font-size:12px;font-weight:600;color:var(--mut);padding:8px 14px}
.ihead:hover{background:var(--head)}
.irow.f{background:var(--amb2)}.irow.f:hover{background:var(--ambHover)}
.irow.n{background:var(--nextBg)}
.irow.done .nm,.irow.done .c-fal b{color:var(--mut)}
.nm{display:block;font-weight:600;line-height:1.25}
.c-nm .pk{display:block}
.mbal{display:none}
.r{text-align:right}.c{text-align:center}
.bal{display:flex;gap:4px;align-items:center}
.bal input,.bigin input{width:100%;text-align:right;background:var(--amb2);color:var(--ink);border:1.5px solid var(--inLine);border-radius:9px;padding:6px 9px;font-weight:600;font-size:16px;min-height:38px}
.bal input:focus,.bigin input:focus,.tin:focus,.addrow input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--shadow)}
input.bad{border-color:var(--bad)!important;background:var(--badSoft)!important}
.plus{flex:none;width:36px;height:38px;border-radius:9px;border:1.5px solid var(--line2);background:var(--card);color:var(--accent);font-size:18px;font-weight:700}
.c-fal{text-align:right}
.c-fal b{display:block;font-size:17px;font-weight:700}
.c-fal small{display:block;font-size:12px;color:var(--mut)}
.c-st{text-align:center}
.empty{padding:18px;text-align:center;color:var(--mut)}
.outb{margin-top:10px}
.olist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ochip{border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;min-height:34px}
.ttabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px;padding:1px}
.ttab{flex:none;display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line2);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;min-height:40px;color:var(--ink2)}
.ttab .dot{width:9px;height:9px;border-radius:50%;background:var(--tc)}
.ttab .tcnt{font-size:12px;color:var(--mut);font-weight:500}
.ttab[aria-selected=true]{background:var(--tc);border-color:var(--tc);color:#fff}
.ttab[aria-selected=true] .dot{background:#fff}.ttab[aria-selected=true] .tcnt{color:rgba(255,255,255,.86)}
.tierhd{background:var(--ts);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;display:grid;gap:8px}
.tr1{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.tr1 b{font-size:17px;color:var(--tt)}
.tr1 span{font-size:13px;color:var(--ink2)}
.tbar{height:8px;background:var(--trackSoft);border-radius:4px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--tc)}
.tr2{font-size:13px;color:var(--ink2)}
.tr3{display:flex;flex-wrap:wrap;gap:8px}
.tcards{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;display:grid;gap:7px;align-content:start}
.tcard.feito{background:var(--doneBg);border-color:var(--doneLine)}
.tline{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.tbon{font-size:12px;font-weight:600;color:var(--tt);background:var(--ts);border-radius:6px;padding:2px 7px}
.lvl{font-size:12px;font-weight:700;color:var(--brown);background:var(--mid);border-radius:6px;padding:2px 6px}
.ttx{font-size:14px;color:var(--ink2);line-height:1.35}
.parts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.part{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line2);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 10px 4px 5px;font-size:13px;min-height:34px;text-align:left}
.part .bx{width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.part .q{font-weight:700}
.part .tg{font-size:12px;opacity:.92}
.part.done{background:var(--okFill);border-color:var(--okFill);color:#fff}
.part.done .bx{background:#fff;color:var(--okFill);border-color:#fff}
.part.cov{background:var(--okSoft);border-color:var(--okLine);color:var(--ok)}
.part.miss{background:var(--badSoft);border-color:var(--badLine);color:var(--bad)}
.tcard.feito{gap:5px;padding:9px 12px}
.tcard.feito .ttx{font-size:13px}
.tcard.feito .part{min-height:28px;padding:2px 9px 2px 4px;font-size:12px}
.tcard.feito .part .bx{width:17px;height:17px;font-size:12px}
.part.done .tg,.part.done .pkm{display:none}
.part .pkm{font-size:12px;font-weight:500;opacity:.85}
.ico{border-radius:6px;flex:none;object-fit:cover;background:#0F1A2B;vertical-align:middle}
.c-nm{display:flex;align-items:center;gap:10px}.c-nm>span{min-width:0}
.part .ico{border-radius:5px}
.fhead{display:flex;align-items:center;gap:12px}
.nmgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.nmcard{display:grid;grid-template-columns:64px minmax(0,1fr);gap:6px 12px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--card)}
.nmcard .ico{grid-row:span 3}
.nmcard .use{font-size:12px;color:var(--mut);display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.nmcard .ask{white-space:nowrap}
.nmcard .okt{font-size:12px;font-weight:700;color:var(--ok);white-space:nowrap}
.nmcard .tin::placeholder{color:var(--mut);font-style:italic;opacity:.75}
.nmcard label{display:grid;gap:3px;font-size:12px;font-weight:600;color:var(--mut)}
.nmcard .tin{min-height:38px;padding:6px 9px;font-size:15px}

const label=id=>{const p=pokeOf(id);return p?nm(id)+' ('+(p==='ALL'?'qualquer Pokémon Fantasma':p)+')':nm(id);};

function norm(x){
  const s=blank();if(!x||typeof x!=='object')return s;
  if(x.balance&&typeof x.balance==='object')for(const it of ITEMS){const v=Number(x.balance[it.id]);if(Number.isFinite(v)&&v>0)s.balance[it.id]=Math.min(Math.floor(v),1e12);}
  if(x.parts&&typeof x.parts==='object')for(const t of TAL){const p=x.parts[t.id];if(!p||typeof p!=='object')continue;const o={};for(const k of Object.keys(t.c))if(p[k]===true||p[k]===2)o[k]=p[k];if(Object.keys(o).length)s.parts[t.id]=o;}
  if(x.done&&typeof x.done==='object')for(const t of TAL)if(x.done[t.id]===true){const o={};for(const k of Object.keys(t.c))o[k]=true;s.parts[t.id]=o;}
  if(Array.isArray(x.tiers)){const t=[1,2,3,4].filter(n=>x.tiers.includes(n));if(t.length)s.tiers=t;}
  if(Array.isArray(x.unlocked))s.unlocked=[2,3,4].filter(n=>x.unlocked.includes(n));
  if(x.items&&typeof x.items==='object')for(const it of ITEMS){const o=x.items[it.id];if(!o||typeof o!=='object')continue;const e={};
    if(o.order==='P')e.order='P';else if(Number.isFinite(Number(o.order))&&Number(o.order)>=1)e.order=Math.min(Math.floor(Number(o.order)),999);
    if(typeof o.name==='string'&&o.name.trim())e.name=o.name.trim().slice(0,60);
    if(typeof o.poke==='string')e.poke=o.poke.trim().slice(0,40);
    if(Object.keys(e).length)s.items[it.id]=e;}
  {const m=Number(x.money);if(Number.isFinite(m)&&m>0)s.money=Math.min(Math.floor(m),1e13);}
  {const l=Number(x.level);if(Number.isFinite(l)&&l>0)s.level=Math.min(Math.floor(l),9999);}
  if(x.hist&&typeof x.hist==='object')for(const [d,o] of Object.entries(x.hist)){if(!DRE.test(d)||!o||typeof o!=='object')continue;const e={};for(const it of ITEMS){const v=Number(o[it.id]);if(Number.isFinite(v)&&v>0)e[it.id]=Math.min(Math.floor(v),1e12);}if(Object.keys(e).length)s.hist[d]=e;}
  if(Array.isArray(x.log))s.log=x.log.filter(e=>e&&typeof e==='object'&&Number.isFinite(e.t)&&typeof e.k==='string'&&e.d&&typeof e.d==='object').slice(-300);
  if(x.upd&&typeof x.upd==='object')for(const it of ITEMS){const d=x.upd[it.id];if(typeof d==='string'&&DRE.test(d))s.upd[it.id]=d;}
  return s;
}

function compute(){
  const sel=new Set(S.tiers),avail={},per={},tal={},RI=rateInfo();
  ITEMS.forEach(it=>{avail[it.id]=S.balance[it.id]||0;per[it.id]={};});
  const unl=new Set([1,...S.unlocked]);
  for(const t of TAL)if(S.parts[t.id])unl.add(t.t);
  {const mx=Math.max(...unl);for(let k=1;k<mx;k++)unl.add(k);}
  const nextOf={},cum={};ITEMS.forEach(it=>{cum[it.id]=0;});let rank=0;
  for(const T of [1,2,3,4].sort((a,b)=>(sel.has(a)?0:1)-(sel.has(b)?0:1)||a-b)){
    const sc=t=>{const P0=S.parts[t.id]||{};let x=0,u=0;for(const [id,q] of Object.entries(t.c))if(!P0[id]){u++;x+=Math.min(1,Math.max(0,q-avail[id])/q);}return u?x:-1;};
    const L=TAL.filter(x=>x.t===T).map(t=>({t,k:sc(t)})).sort((a,b)=>a.k-b.k||a.t.i-b.t.i);
    for(const {t} of L){
      const P0=S.parts[t.id]||{},parts=[];let nd=0,ok=true;
      for(const [id,q] of Object.entries(t.c)){
        const P=per[id][T]||(per[id][T]={tot:0,done:0,alloc:0,miss:0});P.tot+=q;
        if(P0[id]){nd++;P.done+=q;parts.push({id,q,done:true,alloc:0,miss:0,cum:0});continue;}
        const a=Math.min(avail[id],q),m=q-a;avail[id]-=a;P.alloc+=a;P.miss+=m;
        if(sel.has(T))cum[id]+=m;
        if(m>0){ok=false;if(sel.has(T)&&!nextOf[id])nextOf[id]={t,q,a,m};}
        parts.push({id,q,done:false,alloc:a,miss:m,cum:sel.has(T)?cum[id]:m});
      }
      const n=parts.length,complete=nd===n,lock=!unl.has(T);
      tal[t.id]={parts,nd,n,complete,lock,rank:rank++,ready:!complete&&ok&&!lock,status:complete?'feito':ok?(lock?'guardado':'pronto'):nd>0?'parcial':'falta'};
    }
  }
  const rows=[],byId={};
  for(const it of ITEMS){
    const P=per[it.id];let tot=0,miss=0;const tiers={};
    for(const T of S.tiers)if(P[T]&&P[T].tot){tiers[T]=P[T];tot+=P[T].tot;miss+=P[T].miss;}
    if(!tot)continue;
    const cov=tot-miss,r={id:it.id,tot,miss,cov,pct:cov/tot,tiers,next:nextOf[it.id]||null,eta:etaOf(RI,it.id,miss),status:miss===0?'Completo':cov>0?'Em andamento':'Sem progresso'};
    rows.push(r);byId[it.id]=r;
  }
  rows.sort((a,b)=>okey(a.id)-okey(b.id));
  const pend=rows.filter(r=>r.miss>0),T=rows.reduce((x,r)=>x+r.tot,0),C=rows.reduce((x,r)=>x+r.cov,0);
  const tstat={};for(const k of [1,2,3,4]){const L=TAL.filter(x=>x.t===k);const P=L.filter(x=>!tal[x.id].complete);tstat[k]={n:L.length,done:L.filter(x=>tal[x.id].complete).length,ready:L.filter(x=>tal[x.id].ready).length,pend:P.length,part:P.reduce((a,x)=>a+tal[x.id].nd/tal[x.id].n,0),one:P.filter(x=>tal[x.id].n-tal[x.id].nd===1).length,started:P.filter(x=>tal[x.id].nd>0).length};}
  const bon={};
  Object.keys(BON).forEach(k=>{bon[k]={on:0,pend:0,max:0,pendT:new Set()};});
  for(const t of TAL){const b=bon[t.cat];b.max+=t.v;if(tal[t.id].complete){if(unl.has(t.t))b.on+=t.v;else{b.pend+=t.v;b.pendT.add(t.t);}}}
  for(const k of [2,3,4]){bon.dano.max++;bon.defesa.max++;if(unl.has(k)){bon.dano.on++;bon.defesa.on++;}}
  const ready=TAL.filter(t=>tal[t.id].ready).sort((a,b)=>tal[a.id].rank-tal[b.id].rank);
  const cur=[1,2,3,4].find(k=>unl.has(k)&&tstat[k].done<tstat[k].n)||null,nextLock=[2,3,4].find(k=>!unl.has(k))||null;
  const maxEta=L=>{if(!RI)return undefined;let e=0;for(const x of L){if(x===null)return null;e=Math.max(e,x);}return e;};
  let obj=null;
  if(cur){const items=ITEMS.filter(it=>per[it.id][cur]&&per[it.id][cur].miss>0).map(it=>({id:it.id,miss:per[it.id][cur].miss,eta:etaOf(RI,it.id,per[it.id][cur].miss)})).sort((a,b)=>okey(a.id)-okey(b.id));
    obj={t:cur,items,eta:maxEta(items.map(x=>x.eta))};}
  const nexts=[...S.tiers].sort().filter(T=>T!==cur&&(!cur||T>cur)&&tstat[T].done<tstat[T].n).map(T=>{
    const items=ITEMS.filter(it=>per[it.id][T]&&per[it.id][T].miss>0).map(it=>{const c=S.tiers.filter(k=>k<=T).reduce((a,k)=>a+(per[it.id][k]?per[it.id][k].miss:0),0);return {id:it.id,miss:per[it.id][T].miss,eta:etaOf(RI,it.id,c)};}).sort((a,b)=>okey(a.id)-okey(b.id));
    return {t:T,items,eta:maxEta(items.map(x=>x.eta)),lock:!unl.has(T)};});
  const near=TAL.filter(t=>unl.has(t.t)&&!tal[t.id].complete&&!tal[t.id].ready).map(t=>{const ms=tal[t.id].parts.filter(p=>!p.done&&p.miss>0);return {t,miss:ms,fr:ms.reduce((x,p)=>x+p.miss/p.q,0),eta:maxEta(ms.map(p=>etaOf(RI,p.id,p.cum)))};}).sort((a,b)=>a.fr-b.fr||tal[a.t.id].rank-tal[b.t.id].rank);
  const fl=pend.map(r=>r.id);
  return {nexts,left:avail,rows,byId,per,tal,tstat,bon,ready,unl,cur,nextLock,obj,near,RI,etaAll:maxEta(pend.map(r=>r.eta)),focus:fl[0]||null,next:fl[1]||null,overall:T?C/T:1,complete:rows.filter(r=>r.miss===0).length};
}

const stHtml=r=>{const c=r.status==='Completo'?'p-ok':r.status==='Em andamento'?'p-mid':'p-bad';return '<span class="pill '+c+'">'+r.status+'</span>';};

  if(ui.drag){ui.dragPending=true;return;}
  const a=document.activeElement,k=a&&a.dataset?a.dataset.k:null;

  renderTop();renderResumo(R);renderItens(R);renderDep(R);renderTal(R);renderBonus(R);renderHist(R);renderSheet(R,true);renderTabbar(R);
  if(k){const el=document.querySelector('[data-k="'+k+'"]');if(el&&!el.disabled&&el!==document.activeElement){el.focus({preventScroll:true});if(el.matches('input[type=text]'))try{el.select();}catch(e){}}}

function liveRender(){
  if(ui.drag){ui.dragPending=true;liveT=null;return;}

  renderTop();renderResumo(R);renderTal(R);renderBonus(R);renderTabbar(R);if(!$('deposito').contains(a))renderDep(R);renderHist(R);

function parseQty(raw,cur){
  const s=String(raw).trim().toLowerCase().replace(/\s+/g,'');
  if(s==='')return 0;
  const m=s.match(/^([+-]?)(\d[\d.,]*)(kkk|kk|k|mil|mi|m|bi|b)?$/);if(!m)return null;
  let v;
  if(m[3]){const t=m[2].replace(/,/g,'.'),mu={k:1e3,mil:1e3,kk:1e6,mi:1e6,m:1e6,kkk:1e9,b:1e9,bi:1e9}[m[3]];v=(t.split('.').length===2?parseFloat(t):parseFloat(t.replace(/\./g,'')))*mu;}
  else v=parseFloat(m[2].replace(/[.,]/g,''));
  if(!Number.isFinite(v))return null;v=Math.round(v);
  return m[1]==='+'?cur+v:m[1]==='-'?Math.max(0,cur-v):v;
}

async function flush(){
  if(saving||!dirty||!ref)return;
  saving=true;dirty=false;
  try{await ref.set(JSON.parse(JSON.stringify(Object.assign({},S,{updatedAt:new Date().toISOString()}))));retried=false;status('Salvo na nuvem','ok');}
  catch(e){const c=e&&e.code;
    if(c==='invalid_argument'||c==='not_granted'||c==='revoked'){canWrite=false;status('Somente leitura','bad');schedule();}
    else if(c==='unavailable'&&!retried){retried=true;dirty=true;setTimeout(()=>{flush();},800+Math.random()*900);}
    else{dirty=true;status('Não salvou'+(c?' ('+c+')':''),'bad');}}
  finally{saving=false;if(dirty&&!retried)flush();}
}

function farmDiff(a,b){
  const d={},bb={},hh={},pp=[];
  for(const id of new Set([...Object.keys(a.balance||{}),...Object.keys(b.balance||{})])){const x=(b.balance[id]||0)-((a.balance||{})[id]||0);if(x)bb[id]=x;}
  const ah=a.hist||{};for(const day of new Set([...Object.keys(ah),...Object.keys(b.hist||{})])){const A=ah[day]||{},B=b.hist[day]||{};for(const id of new Set([...Object.keys(A),...Object.keys(B)])){const x=(B[id]||0)-(A[id]||0);if(x)(hh[day]||(hh[day]={}))[id]=x;}}
  const ap=a.parts||{};for(const t of TAL){const A=ap[t.id]||{},B=b.parts[t.id]||{};for(const k of Object.keys(t.c))if((A[k]||0)!==(B[k]||0))pp.push([t.id,k,A[k]||0,B[k]||0]);}
  if(Object.keys(bb).length)d.b=bb;if(Object.keys(hh).length)d.h=hh;if(pp.length)d.p=pp;
  const m=(b.money||0)-(a.money||0);if(m)d.m=m;
  const au=a.unlocked||[],ua=b.unlocked.filter(x=>!au.includes(x)),ur=au.filter(x=>!b.unlocked.includes(x));if(ua.length)d.ua=ua;if(ur.length)d.ur=ur;
  return d;
}

  L.push('TALENTOS');
  for(const T of [1,2,3,4]){const z=R.tstat[T];L.push('Tier '+T+': '+z.done+' de '+z.n+' concluídos'+(unl.includes(T)?' (liberado)':' (travado)')+(S.tiers.includes(T)?'':' (fora do estoque)'));
    for(const t of TAL.filter(x=>x.t===T)){const s=R.tal[t.id];L.push('  '+tn(t)+' ['+STL[s.status][0]+'] +'+t.v+'% '+BON[t.cat][0]+(t.l?' (nível '+t.l+')':'')+' | '+s.parts.map(p=>nf(p.q)+' '+nm(p.id)+(p.done?' (entregue)':p.miss?' (falta '+nf(p.miss)+')':' (coberto pelo Balance)')).join(' + '));}}
  return L.join('\n');
}
async function copyText(txt,what){
  try{await navigator.clipboard.writeText(txt);toast(what+' copiado.');}
  catch(e){ui.sheet={type:'text',title:what,txt};$('sheet').dataset.type='';render();}
}

document.addEventListener('click',e=>{
  if(Date.now()<noClickUntil&&e.target.closest('.sq')){e.preventDefault();e.stopPropagation();return;}
  const menu=$('menu');
  if(!menu.hidden&&!e.target.closest('#menu')&&!e.target.closest('[data-act=menu]'))menu.hidden=true;
  if(e.target===$('sheet')){closeSheet();return;}
  if(e.target.closest('input,textarea'))return;
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  if(a==='menu'){menu.hidden=!menu.hidden;return;}
  if(a==='tema'){applyTema(isDark()?'claro':'escuro');return;}
  if(a==='tema-set'){applyTema(el.dataset.v);return;}
  if(['ia','bk','rs','link','help','loot','ordem','undo','tab'].includes(a))menu.hidden=true;
  switch(a){
    case 'tier':{if(ro())return;const t=+el.dataset.t;S.tiers=[1,2,3,4].filter(x=>x<=t);commit();toast('Estocando itens até o T'+t+'.');break;}
    case 'tab':setTab(el.dataset.v);break;
    case 'hfil':ui.hfil=el.dataset.v;ui.confirmRev=null;render();break;
    case 'hrev':{const t=+el.dataset.t;if(ui.confirmRev!==t){ui.confirmRev=t;render();setTimeout(()=>{if(ui.confirmRev===t){ui.confirmRev=null;render();}},4000);}else revertEntry(t);break;}
    case 'ttab':ui.ttab=+el.dataset.t;ui.confirmTier=0;render();break;
    case 'ifil':ui.ifil=el.dataset.v;render();break;
    case 'tfil':ui.tfil=el.dataset.v;render();break;
    case 'out':ui.showOut=!ui.showOut;render();break;
    case 'open':openItem(el.dataset.item);break;
    case 'close':closeSheet();break;
    case 'part':togglePart(el.dataset.tid,el.dataset.item);break;
    case 'tcomp':completeTalent(el.dataset.tid);break;
    case 'tundo':undoTalent(el.dataset.tid);break;
    case 'tierall':tierAll(+el.dataset.t);break;
    case 'unl':toggleUnl(+el.dataset.t);break;
    case 'add':if(!ro()){const id=el.dataset.item,cur=S.balance[id]||0;setBal(id,cur+Number(el.dataset.v));logDelta(id,(S.balance[id]||0)-cur);commit();}break;
    case 'loot':if(ro())return;ui.sheet={type:'loot'};ui.lootMore=false;$('sheet').dataset.type='';render();setTimeout(()=>{if(isDesk()){const x=document.querySelector('#sheet .lnow [data-loot]')||document.querySelector('#sheet [data-loot]');if(x)x.focus();}},0);break;
    case 'lootmode':{ui.lootMode=el.dataset.v;const dr=ui.lootMode!=='total';document.querySelectorAll('#sheet [data-act=lootmode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===ui.lootMode)));document.querySelectorAll('#sheet [data-loot]').forEach(x=>{x.placeholder=dr?'+0':nf(Number(x.dataset.bal0)||0);});break;}
    case 'lootall':{const v=lootVals();ui.lootAll=!ui.lootAll;rerenderSheet(()=>{for(const k in v){const x=document.querySelector('#sheet [data-loot="'+k+'"]');if(x)x.value=v[k];}});break;}
    case 'lootgo':lootGo();break;
    case 'ordem':ui.sheet={type:'ordem'};$('sheet').dataset.type='';render();break;
    case 'ordmv':ordMove(el.dataset.item,+el.dataset.v);break;
    case 'ordp':ordPassive(el.dataset.item);break;
    case 'dlvgo':dlvGo(false);break;
    case 'dlvno':dlvGo(true);break;
    case 'tgo':goTal(el.dataset.tid);break;
    case 'undo':undoLast();break;
    case 'addv':sheetAdd();break;
    case 'ia':copyText(aiText(),'Texto para IA');break;
    case 'bk':copyText(JSON.stringify({app:'talentos-fantasma',v:2,salvoEm:new Date().toISOString(),estado:S}),'Backup');break;
    case 'link':copyText(linkWithData(),'Link com seus dados');break;
    case 'rs':if(ro()){toast('Somente leitura: não dá para restaurar aqui.');return;}ui.sheet={type:'restore'};$('sheet').dataset.type='';render();setTimeout(()=>{const t=$('rsTa');if(t)t.focus();},0);break;
    case 'rsgo':{let x;try{x=JSON.parse(($('rsTa')||{}).value||'');}catch(err){toast('Esse texto não é um backup válido.');return;}
      const src=x&&x.estado?x.estado:x;if(!src||typeof src!=='object'||!src.balance){toast('Esse texto não é um backup válido.');return;}
      S=norm(src);ui.sheet=null;commit();toast('Backup restaurado.');break;}
    case 'help':ui.sheet={type:'help'};$('sheet').dataset.type='';render();break;
    case 'names':ui.sheet={type:'names'};ui.namesAll=false;$('sheet').dataset.type='';$('menu').hidden=true;render();break;
    case 'nmfil':ui.namesAll=el.dataset.v==='all';$('sheet').dataset.type='';render();break;
    case 'nmcopy':copyText(namesText(),'Lista de nomes');break;
    case 'imp':if(ui.importData){S=ui.importData;ui.importData=null;try{history.replaceState(null,'','#resumo');}catch(err){}commit();toast('Dados importados.');}break;
    case 'impno':ui.importData=null;try{history.replaceState(null,'','#resumo');}catch(err){}render();break;
  }
});
document.addEventListener('focusin',e=>{const el=e.target;if(!el.matches)return;
  if(el.matches('input[data-bal]')){edit={k:el.dataset.k,base:S.balance[el.dataset.bal]||0};setTimeout(()=>{try{el.select();}catch(err){}},0);}
  else if(el.matches('input.tin,#sh-add'))setTimeout(()=>{try{el.select();}catch(err){}},0);
});
document.addEventListener('input',e=>{const el=e.target;
  if(el.id==='sh-add'){el.classList.remove('bad');return;}
  if(!el.matches||!el.matches('input[data-bal]')||ro())return;
  const id=el.dataset.bal,base=edit&&edit.k===el.dataset.k?edit.base:(S.balance[id]||0),v=parseQty(el.value,base);
  el.classList.toggle('bad',v===null);if(v===null)return;
  if((S.balance[id]||0)!==v){setBal(id,v);save();scheduleLive();}
});
document.addEventListener('change',e=>{const el=e.target;if(!(el instanceof HTMLInputElement)||ro())return;
  if(el.dataset.bal){const id=el.dataset.bal,base=edit&&edit.k===el.dataset.k?edit.base:(S.balance[id]||0),v=parseQty(el.value,base);edit=null;
    if(v===null){toast('Valor inválido. Use 2622, +500, -200 ou 10k.');render();return;}
    setBal(id,v);logDelta(id,v-base);commit();}
  else if(el.dataset.money){const v=parseQty(el.value,S.money||0);if(v===null){toast('Valor inválido. Ex.: 150000000, 150kk ou +5kk.');render();return;}S.money=Math.min(v,1e13);commit();}
  else if(el.dataset.level){const v=parseInt(el.value.replace(/\D/g,''),10);S.level=Number.isFinite(v)?Math.min(v,9999):0;commit();}
  else if(el.dataset.ord){const id=el.dataset.ord,s=el.value.trim().toLowerCase();S.items[id]=Object.assign({},S.items[id]);
    if(s==='p'||s==='passivo')S.items[id].order='P';else if(/^\d{1,3}$/.test(s)&&+s>=1)S.items[id].order=+s;else if(s==='')delete S.items[id].order;
    else{toast('Use um número (1, 2, 3…) ou a palavra Passivo.');render();return;}
    if(!Object.keys(S.items[id]).length)delete S.items[id];commit();}
  else if(el.dataset.pk){const id=el.dataset.pk,v=el.value.trim().slice(0,40),def=ITEMS[IX[id]].poke;S.items[id]=Object.assign({},S.items[id]);
    const val=/^(all|todos?( os)?( pok[eé]mon)?( fantasma)?|qualquer.*)$/i.test(v)?'ALL':v;
    if(val===def)delete S.items[id].poke;else S.items[id].poke=val;
    if(!Object.keys(S.items[id]).length)delete S.items[id];commit();patchNames();}
  else if(el.dataset.nm){const id=el.dataset.nm,s=el.value.trim().slice(0,60);S.items[id]=Object.assign({},S.items[id]);
    if(s&&(s!==ITEMS[IX[id]].name||ITEMS[IX[id]].ask))S.items[id].name=s;else delete S.items[id].name;
    if(!Object.keys(S.items[id]).length)delete S.items[id];commit();patchNames();}
});
document.addEventListener('focusout',()=>{setTimeout(()=>{if(pendingRender&&!typing()){pendingRender=false;render();}},0);});
let drag=null,noClickUntil=0;
function sqList(){return document.querySelector('#resumo [data-seq]');}
document.addEventListener('pointerdown',e=>{
  if(ro()||e.button>0)return;const card=e.target.closest('#resumo .sq[data-item]');if(!card)return;
  if(e.pointerType!=='mouse'&&!e.target.closest('.grip'))return;
  if(e.pointerType==='mouse')e.preventDefault();
  drag={card,id:card.dataset.item,x:e.clientX,y:e.clientY,pid:e.pointerId,on:false,start:[...sqList().children].map(c=>c.dataset.item).join()};
});
function startDrag(e){
  const c=drag.card,r=c.getBoundingClientRect(),g=c.cloneNode(true);
  g.classList.add('sqghost');g.removeAttribute('data-k');g.style.width=r.width+'px';g.style.height=r.height+'px';g.style.left=r.left+'px';g.style.top=r.top+'px';
  document.body.appendChild(g);drag.g=g;drag.dx=e.clientX-r.left;drag.dy=e.clientY-r.top;drag.on=true;ui.drag=true;
  c.classList.add('sqhole');document.body.classList.add('dragging');
}
function moveDrag(e){
  const d=drag;d.g.style.left=(e.clientX-d.dx)+'px';d.g.style.top=(e.clientY-d.dy)+'px';
  const el=document.elementFromPoint(e.clientX,e.clientY),ov=el&&el.closest('#resumo .sq[data-item]');
  if(ov&&ov!==d.card&&ov.parentNode===d.card.parentNode){const L=[...ov.parentNode.children];if(L.indexOf(ov)>L.indexOf(d.card))ov.after(d.card);else ov.before(d.card);}
  const m=70;if(e.clientY<m)window.scrollBy(0,-14);else if(e.clientY>innerHeight-m)window.scrollBy(0,14);
}
function finishDrag(apply){
  const d=drag;drag=null;if(!d||!d.on)return;
  if(d.g)d.g.remove();d.card.classList.remove('sqhole');document.body.classList.remove('dragging');ui.drag=false;noClickUntil=Date.now()+350;
  const ids=[...sqList().children].map(c=>c.dataset.item);
  if(apply&&ids.join()!==d.start){setOrder(ids);commit();toast('Ordem de farm atualizada.',[{label:'Desfazer',fn:undoLast}]);}
  else render();
}
function cancelDrag(){finishDrag(false);}
document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.pid)return;
  if(!drag.on){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6)return;startDrag(e);}
  e.preventDefault();moveDrag(e);
},{passive:false});
document.addEventListener('pointerup',e=>{if(drag&&e.pointerId===drag.pid){if(drag.on)finishDrag(true);else drag=null;}});
document.addEventListener('pointercancel',e=>{if(drag&&e.pointerId===drag.pid){if(drag.on)finishDrag(false);else drag=null;}});
document.addEventListener('toggle',e=>{if(e.target.matches&&e.target.matches('#sheet .lmore'))ui.lootMore=e.target.open;},true);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(drag&&drag.on){cancelDrag();return;}$('menu').hidden=true;if(ui.sheet)closeSheet();return;}
  if(e.altKey&&/^Arrow/.test(e.key)&&e.target.matches&&e.target.matches('.sq[data-item]')&&!ro()){e.preventDefault();ordMove(e.target.dataset.item,/Left|Up/.test(e.key)?-1:1);commit();return;}
  if(e.key==='Enter'&&e.target.matches&&e.target.matches('input')){if(e.target.id==='sh-add'){e.preventDefault();sheetAdd();}else e.target.blur();}
});
const onNav=()=>{const h=location.hash.slice(1)||'resumo';if(TABK.includes(h)&&h!==ui.tab)setTab(h,true);};window.addEventListener('hashchange',onNav);window.addEventListener('popstate',onNav);window.addEventListener('resize',()=>{const t=document.querySelector('.top');if(t)document.documentElement.style.setProperty('--toph',t.offsetHeight+'px');});

function goLocal(msg){
  mode='local';let x=null;
  try{x=JSON.parse(localStorage.getItem(KEY)||'null')||JSON.parse(localStorage.getItem(OLDKEY)||'null');}catch(e){}
  S=norm(x);baseSnap();
  if(location.hash.startsWith('#importar=')){try{ui.importData=norm(dec(location.hash.slice(10)));}catch(e){toast('O link de dados está incompleto ou corrompido.');}}
  render();status(msg||'Salvo neste aparelho','w');
}
async function init(){
  const h=location.hash.slice(1);if(TABK.includes(h))ui.tab=h;
  render();status('Carregando…','w');
  let api=null;try{if(window.claude&&typeof window.claude.use==='function')api=window.claude;}catch(e){}
  if(!api){goLocal();return;}
  const timer=setTimeout(()=>{if(mode==='loading')status('Ainda carregando…','w');},10000);
  let dbx=null;try{dbx=await api.use('db');}catch(e){dbx=null;}
  if(!dbx){clearTimeout(timer);goLocal('Salvo neste aparelho');return;}
  try{const u=await api.use('user');if(u&&typeof u.can==='function'){const w=await u.can('data.write');if(w===false)canWrite=false;}}catch(e){}
  try{ref=dbx.doc('tracker/estado');}catch(e){clearTimeout(timer);goLocal();return;}
  ref.onSnapshot(snap=>{
    clearTimeout(timer);
    if(snap.metadata&&snap.metadata.hasPendingWrites)return;
    const first=mode==='loading';mode='db';
    if(snap.exists){const n=norm(snap.data());if(first||JSON.stringify(n)!==JSON.stringify(S)){S=n;baseSnap();renderSafe();}}
    else if(first){S=blank();baseSnap();renderSafe();toast('Ainda não há dados salvos. Comece pelo Balance de cada item.');}
    if(!canWrite)status('Somente leitura','w');
    else if(snap.metadata&&snap.metadata.fromCache)status('Sincronizando…','w');
    else if(!dirty&&!saving)status('Salvo na nuvem','ok');
  },err=>{clearTimeout(timer);if(mode==='loading')goLocal('Sem nuvem: salvo neste aparelho');else status('Conexão caiu: recarregue','bad');});
}
paintTema();
try{const mq=window.matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener)mq.addEventListener('change',paintTema);else if(mq.addListener)mq.addListener(paintTema);}catch(e){}
try{new MutationObserver(paintTema).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});}catch(e){}
init();
}
</script>
